# K6Flow — todo en uno (una sola imagen de la app + PostgreSQL).
#
#   curl -O https://raw.githubusercontent.com/jereok91/k6Flow/main/deploy/docker-compose.all-in-one.yml
#   printf 'POSTGRES_PASSWORD=una-clave\nADMIN_PASSWORD=otra-clave-de-12-o-mas\n' > .env
#   docker compose -f docker-compose.all-in-one.yml up -d
#
# La imagen incluye web, orchestrator, grabador y las migraciones: no hay servicios de build ni
# pasos previos. Sólo PostgreSQL queda aparte, igual que redis en yopass.
#
# Variante sin grabador (más chica, ~1/5 del peso): agregá K6FLOW_IMAGE=k6flow-slim al .env.
name: k6flow

services:
  k6flow:
    # K6FLOW_IMAGE=k6flow-slim para la variante sin grabador.
    image: ghcr.io/jereok91/${K6FLOW_IMAGE:-k6flow}:${K6FLOW_VERSION:-latest}
    init: true
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-k6flow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env}@db:5432/${POSTGRES_DB:-k6flow}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD (min 12 chars) in your .env}
      # Red donde el orchestrator crea los contenedores de k6.
      ORCHESTRATOR_NETWORK: k6flow_k6runner
      MAX_VUS_PER_RUN: ${MAX_VUS_PER_RUN:-500}
      MAX_MEMORY_MIB_PER_RUN: ${MAX_MEMORY_MIB_PER_RUN:-4096}
      MAX_CPU_MILLIS_PER_RUN: ${MAX_CPU_MILLIS_PER_RUN:-4000}
      ALLOWED_TARGETS: ${ALLOWED_TARGETS:-}
      CAPTURE_DIR: /var/lib/k6flow/captures
    volumes:
      # Un contenedor de k6 por ejecución.
      - /var/run/docker.sock:/var/run/docker.sock
      - captures:/var/lib/k6flow/captures
    depends_on:
      db:
        condition: service_healthy
    networks: [edge, backend, k6runner]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/healthz').then(async r => { if (!r.ok || (await r.json()).status !== 'ok') process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  db:
    image: postgres:17.7-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-k6flow}
      POSTGRES_USER: ${POSTGRES_USER:-k6flow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

networks:
  edge: {}
  backend:
    internal: true
  k6runner: {}

volumes:
  postgres-data: {}
  captures: {}

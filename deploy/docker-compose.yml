services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: production
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    networks: [edge, backend]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/healthz').then(async r => { if (!r.ok || (await r.json()).status !== 'ok') process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
  orchestrator:
    build:
      context: ..
      dockerfile: apps/orchestrator/Dockerfile
      target: production
    networks: [backend]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  db:
    image: postgres:17.7-alpine3.22
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-k6flow}
      POSTGRES_USER: ${POSTGRES_USER:-k6flow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an external env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
networks:
  edge: {}
  backend:
    internal: true
volumes:
  postgres-data: {}

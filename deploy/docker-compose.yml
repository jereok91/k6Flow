services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: production
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # Human-authorized 2026-10-02 (Phase 4, K6F4-01b): web→db wiring for own-credential auth storage; process health stays independent of the DB (no depends_on).
      DATABASE_URL: postgresql://${POSTGRES_USER:-k6flow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-k6flow}
      # Recorder service for visual recording
      RECORDER_UPSTREAM: http://recorder:8081
      # Token the web tier uses to stop a recording and read its capture back
      RECORDER_AUTH_TOKEN: ${RECORDER_AUTH_TOKEN:-dev-token}
      # Orchestrator service token for API proxy
      ORCHESTRATOR_SERVICE_TOKEN: ${ORCHESTRATOR_SERVICE_TOKEN:-k6flow-internal-token}
    networks: [edge, backend]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/healthz').then(async r => { if (!r.ok || (await r.json()).status !== 'ok') process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
  orchestrator:
    build:
      context: ..
      dockerfile: apps/orchestrator/Dockerfile
      target: production
    environment:
      # K6F9-03 SSRF protection: K6 containers run in isolated network
      ORCHESTRATOR_NETWORK: ${ORCHESTRATOR_NETWORK:-deploy_k6runner}
      # Service token for API authentication
      SERVICE_TOKEN: ${ORCHESTRATOR_SERVICE_TOKEN:-k6flow-internal-token}
      # Per-run ceilings: larger start/preflight requests are rejected with 422.
      MAX_VUS_PER_RUN: ${MAX_VUS_PER_RUN:-500}
      MAX_MEMORY_MIB_PER_RUN: ${MAX_MEMORY_MIB_PER_RUN:-4096}
      MAX_CPU_MILLIS_PER_RUN: ${MAX_CPU_MILLIS_PER_RUN:-4000}
    networks: [backend, k6runner]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  recorder:
    build:
      context: ..
      dockerfile: apps/recorder/Dockerfile
    # Long-lived across recordings: an init (tini) reaps each closed browser's processes.
    init: true
    # Ports not exposed externally - accessed via Next.js proxy
    environment:
      PORT: "8081"
      AUTH_TOKEN: ${RECORDER_AUTH_TOKEN:-dev-token}
      MAX_DURATION_MS: ${RECORDER_MAX_DURATION_MS:-3600000}
      INACTIVITY_MS: ${RECORDER_INACTIVITY_MS:-300000}
      START_URL: "about:blank"
      VIEWPORT_WIDTH: "1280"
      VIEWPORT_HEIGHT: "720"
      # Captures outlive the container: the web tier reads them after a stop and
      # a restart must not lose recordings the library has not collected yet.
      CAPTURE_DIR: /var/lib/k6flow/captures
    volumes:
      - recorder-captures:/var/lib/k6flow/captures
    # K6F9-03 SSRF protection: recorder on edge only, cannot reach internal services
    networks: [edge]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  db:
    image: postgres:17.7-alpine3.22
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-k6flow}
      POSTGRES_USER: ${POSTGRES_USER:-k6flow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an external env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
networks:
  edge: {}
  backend:
    internal: true
  # K6F9-03 SSRF protection: isolated network for K6 test containers
  # K6 containers can only reach external targets, not internal services
  k6runner: {}
volumes:
  postgres-data: {}
  recorder-captures: {}

name: Release images

# Se dispara sólo con un tag de versión: git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  version:
    name: Validate version tag
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$tag' is not a vX.Y.Z version" >&2
            exit 1
          fi
          echo "value=${tag#v}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.image }}
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            dockerfile: apps/web/Dockerfile
            target: production
          - image: orchestrator
            dockerfile: apps/orchestrator/Dockerfile
            target: production
          - image: recorder
            dockerfile: apps/recorder/Dockerfile
            target: ""
          - image: setup
            dockerfile: apps/web/Dockerfile
            target: setup
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/k6flow-${{ matrix.image }}
          # Una versión publica cuatro tags por imagen: 1.2.3, 1.2, 1 y latest.
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.value }}
            type=semver,pattern={{major}},value=v${{ needs.version.outputs.value }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

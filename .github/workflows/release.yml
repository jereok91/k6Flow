name: Release images

# Se dispara sólo con un tag de versión: git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  version:
    name: Validate version tag
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$tag' is not a vX.Y.Z version" >&2
            exit 1
          fi
          echo "value=${tag#v}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.name }}
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: k6flow-web
            dockerfile: apps/web/Dockerfile
            target: production
          - name: k6flow-orchestrator
            dockerfile: apps/orchestrator/Dockerfile
            target: production
          - name: k6flow-recorder
            dockerfile: apps/recorder/Dockerfile
            target: ""
          - name: k6flow-setup
            dockerfile: apps/web/Dockerfile
            target: setup
          # Todo en uno: web + orchestrator + grabador + migraciones en una sola imagen.
          - name: k6flow
            dockerfile: deploy/all-in-one/Dockerfile
            target: all-in-one
          # Misma app sin grabador: mucho más chica para quien sólo edita y ejecuta.
          - name: k6flow-slim
            dockerfile: deploy/all-in-one/Dockerfile
            target: slim
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          # Una versión publica cuatro tags por imagen: 1.2.3, 1.2, 1 y latest.
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.value }}
            type=semver,pattern={{major}},value=v${{ needs.version.outputs.value }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  announce:
    name: Publish GitHub Release
    needs: [version, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compose the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          # Generated notes only list merged PRs; commits pushed straight to main would leave the
          # release without a changelog, so the commit list is built here as the source of truth.
          generated="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${tag}" --jq .body)"
          previous="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          {
            echo "## Imágenes publicadas"
            echo
            echo '```'
            for image in k6flow-web k6flow-orchestrator k6flow-recorder k6flow-setup k6flow k6flow-slim; do
              echo "ghcr.io/${owner}/${image}:${version}   (también :${version%.*} , :${version%%.*} y :latest)"
            done
            echo
            echo "\`k6flow\` es la imagen todo en uno (web + orchestrator + grabador + migraciones) y"
            echo "\`k6flow-slim\` la misma app sin grabador; con \`deploy/docker-compose.all-in-one.yml\`"
            echo "sólo se agrega PostgreSQL (K6FLOW_IMAGE=k6flow-slim para la variante chica)."
            
            echo '```'
            echo
            echo "## Cómo levantarlo"
            echo
            echo '```bash'
            echo "curl -O https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/deploy/docker-compose.release.yml"
            echo "printf 'POSTGRES_PASSWORD=cambia-esta-clave\\nADMIN_PASSWORD=otra-clave-de-12-o-mas\\nK6FLOW_VERSION=${version}\\n' > .env"
            echo "docker compose -f docker-compose.release.yml up -d"
            echo '```'
            echo
            echo "El servicio \`setup\` aplica las migraciones y crea el admin antes de que arranque el web."
            echo
            echo "## Cambios"
            echo
            if [[ -n "${previous}" ]]; then
              git log --no-merges --pretty='- %s (`%h`)' "${previous}..${tag}"
            else
              git log --no-merges --pretty='- %s (`%h`)' "${tag}"
            fi
            echo
            # Extra context GitHub adds when the change came through pull requests: the commit
            # list is already above, so only the non-empty extra sections are appended.
            extra="$(printf '%s\n' "${generated}" | grep -v '^\*\*Full Changelog\*\*:' | sed '/^[[:space:]]*$/d' || true)"
            if [[ -n "${extra}" ]]; then
              echo "${extra}"
            fi
          } > release-notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          fi

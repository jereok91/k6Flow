name: Phase 0 checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Recorder lifecycle tests drive a real Chromium, pinned by the lockfile. Since Playwright
      # 1.64 the headless shell is a separate download, and both are needed: `chromium` alone
      # leaves every headless launch failing.
      - run: pnpm --filter @k6flow/recorder exec playwright install --with-deps chromium chromium-headless-shell
      - run: pnpm --filter @k6flow/recorder test
      - run: pnpm lint
      - run: pnpm --filter @k6flow/web build
      - run: go test ./...
        working-directory: apps/orchestrator
      - run: go vet ./...
        working-directory: apps/orchestrator
      - run: go build ./...
        working-directory: apps/orchestrator
      - run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config
      - run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml config
      - run: bash scripts/check-phase-0-compose.sh
      # Release artifact: pull-only compose that users run without the repository.
      - run: bash scripts/check-release-compose.sh
